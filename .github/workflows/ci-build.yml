# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: CI Build

on:
  push:
    # native-parity is the shared roadmap branch (docs/ROADMAP.md); drop it once merged.
    branches: [ "main", "native-parity" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: check
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
        with:
          arguments: ${{ matrix.target }}

  # The desktop suites on macOS, where the editor takes the Mac key bindings and
  # the system fonts differ from Linux; the Ubuntu `check` covers everything else.
  desktop-macos:
    runs-on: macos-26
    # A hung UI test would otherwise hold a macOS runner for the six-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run the desktop test suites
        run: >
          ./gradlew --stacktrace
          :ComposeTextEditor:desktopTest
          :ComposeTextEditorFind:desktopTest
          :ComposeTextEditorSpellCheck:desktopTest
      - name: Keep the test reports
        # macOS-only failures cannot be reproduced on Linux, so keep what they said.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-test-results
          path: |
            */build/test-results/desktopTest/
            */build/reports/tests/desktopTest/

  # Kotlin/Native iOS targets only compile on macOS, so the Ubuntu `check` never
  # builds iosMain. This job compiles the libraries for device and simulator, runs
  # any iOS tests, and builds the sample app the same way Xcode does.
  ios:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile the libraries for iOS and run iOS tests
        run: >
          ./gradlew --stacktrace
          :ComposeTextEditor:compileKotlinIosArm64
          :ComposeTextEditor:iosSimulatorArm64Test
          :ComposeTextEditorSpellCheck:compileKotlinIosArm64
          :ComposeTextEditorSpellCheck:iosSimulatorArm64Test
          :ComposeTextEditorFind:compileKotlinIosArm64
          :ComposeTextEditorFind:iosSimulatorArm64Test
      - name: Build the iOS sample app
        # The project's run script phase links the simulator framework through Gradle.
        run: >
          xcodebuild
          -project sampleAppiOS/SampleAppiOS.xcodeproj
          -scheme SampleAppiOS
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          build
